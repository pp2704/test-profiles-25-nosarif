trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:
- script: |
    echo "Node: $(node --version)"
    echo "npm:  $(npm --version)"
  displayName: 'Print Node version'

- task: CodeScanCloudPrepare@3
  inputs:
    CodeScanCloud: 'qa-test_azure'
    organization: 'cs-release-26-0-12'
    scannerMode: 'CLI'
    configMode: 'manual'
    cliProjectKey: 'profiles_azure_devops'
    cliProjectName: 'profiles_azure_devops'
    cliSources: '.'
    extraProperties: |
      sonar.qualitygate.wait=true
      sonar.qualitygate.timeout=3600000
      sonar.token=squ_4a75410fac823bee2394114852693f0d458bb8f7
- task: CodeScanCloudAnalyze@3
  inputs:
    jdkversion: 'JAVA_HOME_17_X64'
- task: CodeScanCloudPublish@3
  inputs:
    pollingTimeoutSec: '300'